<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="zt-token" content="__ZT_TOKEN__">
<title>zt · slip-box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='19' rx='3' fill='%23c4622d'/%3E%3Crect x='6' y='4' width='20' height='4' rx='1.5' fill='%23e9b38f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
<script src="/vendor/katex/katex.min.js" defer></script>
<script src="/layout.js" defer></script>
<script src="/draft.js" defer></script>
<script src="/ask.js" defer></script>
<script src="/features.js" defer></script>
<script src="/lock.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="icon-btn rail-toggle" id="rail-toggle" title="Cabinet" aria-label="Toggle cabinet">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/" title="ROOT">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">zt</span>
    </a>
    <div class="nav-arrows" role="group" aria-label="History">
      <button class="icon-btn nav-btn" id="nav-back" disabled aria-label="Back"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
      <button class="icon-btn nav-btn" id="nav-fwd" disabled aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
    </div>
    <nav class="trail" id="trail" aria-label="Pointer"></nav>
    <div class="command" id="command">
      <span class="command-prompt" aria-hidden="true">›</span>
      <input id="command-input" autocomplete="off" spellcheck="false"
             placeholder="go 1/2 · n · b · e · t Title · l · ws agent · ls · help — or search">
      <kbd class="command-hint">:</kbd>
      <div class="command-menu" id="command-menu" role="listbox" hidden></div>
    </div>
    <div class="topbar-actions">
      <button class="pill" id="broken-pill" hidden title="Broken links (lsbk)"></button>
      <button class="pill" id="lock-pill" hidden title="Tree Lock integrity faults: open the lock panel"></button>
      <span class="stats" id="stats"></span>
      <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
      <button class="icon-btn" id="quit" title="Close this window (the GUI runs until zt down)" aria-label="Close this window">
        <svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
  </header>

  <aside class="rail" id="rail">
    <div class="ws-switch" id="workspace-switch" role="tablist" aria-label="Workspace"></div>
    <p class="ws-note" id="workspace-note"></p>
    <div class="rail-search">
      <button class="search-field" id="search-open" title="Search every card (/)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Search cards</span><kbd>/</kbd>
      </button>
    </div>
    <div class="rail-scroll">
      <section class="drawer-group">
        <header><h2>Topic zone</h2><button class="mini-btn" data-action="new-topic" title="New Topic (t)">+ t</button></header>
        <div id="topic-drawers" class="drawers"></div>
      </section>
      <section class="drawer-group">
        <header><h2>Literature zone</h2><button class="mini-btn" data-action="new-literature" title="New Literature Card (l)">+ l</button></header>
        <div id="literature-drawers" class="drawers"></div>
      </section>
    </div>
    <footer class="rail-footer">
      <button class="mini-btn" id="locks-open" title="Tree locks: the frozen trees, their seals and history">Locks</button>
      <span id="archive-root" class="archive-root"></span>
    </footer>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-bar">
      <div class="seg" role="tablist">
        <button role="tab" data-mode="map" class="on">Map</button>
        <button role="tab" data-mode="table" title="The Table: lay related cards side by side (v)">Table<b class="seg-count" id="table-count" hidden></b></button>
        <button role="tab" data-mode="constellation">Constellation</button>
      </div>
      <div class="stage-title" id="stage-title"></div>
      <div class="ask-bar" id="ask-bar" hidden>
        <span class="ask-mark" aria-hidden="true">?</span>
        <span class="ask-body">
          <span class="ask-q" id="ask-q"></span>
          <span class="ask-terms" id="ask-terms"></span>
        </span>
        <span class="ask-note" id="ask-note" hidden></span>
        <button class="btn" id="ask-cancel" title="Cancel: put the previous Spread back on the Table (Esc)">Cancel</button>
        <button class="btn primary" id="ask-keep" title="Keep: save these cards as a new Spread (y)">Keep</button>
      </div>
      <button class="lens-toggle" id="lens-toggle" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="11" height="5" rx="1"/><rect x="9" y="14" width="11" height="5" rx="1"/><path d="M7 10v6.5h2"/></svg>
        <span>Focus</span><kbd>x</kbd>
      </button>
      <div class="table-tools" id="table-tools" hidden>
        <button class="spread-pick" id="spread-pick" title="Spreads: the sets of cards kept for the Table">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="11" height="8" rx="1"/><rect x="9.5" y="10" width="11" height="8" rx="1"/></svg>
          <span id="spread-name">Spread</span><i aria-hidden="true">▾</i>
        </button>
        <div class="seg arrange" role="group" aria-label="Arrange the cards">
          <button data-arrange="gather" title="Gather the cards around the one you hold">Gather</button>
          <button data-arrange="line" title="Line the cards up in reading order, following their Links">Line up</button>
          <button data-arrange="tree" title="Stand the cards in one column per tree, in Folgezettel order">By tree</button>
        </div>
        <button class="lens-toggle" id="file-spread" title="Write a card that lists these cards, filed after the card you hold">File as card</button>
        <button class="lens-toggle" id="ask-open" title="Ask the box a question: the cards it can justify lie on a temporary Table until you Keep or Cancel them (ask)">Ask the box</button>
      </div>
      <div class="zoom">
        <button class="icon-btn" data-zoom="out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="icon-btn" data-zoom="fit" title="Fit" aria-label="Fit to view"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="icon-btn" data-zoom="in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>
    <div class="viewport" id="viewport">
      <div class="desk" id="desk" hidden></div>
      <div class="plane" id="plane">
        <svg class="edges" id="edges"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
      <div class="table-plane" id="table-plane" hidden>
        <svg class="threads" id="threads" aria-hidden="true"></svg>
        <button class="spread-question" id="spread-question" type="button" hidden aria-expanded="false"><span class="sq-mark" aria-hidden="true">?</span><span class="sq-text" id="spread-question-text"></span></button>
        <div class="tcards" id="tcards"></div>
        <div class="reach" id="reach" hidden></div>
      </div>
      <div class="table-empty" id="table-empty" hidden></div>
      <button class="table-hand" id="table-hand" hidden></button>
      <div class="table-box" id="table-box" aria-hidden="true"><span>Back in the box</span></div>
      <canvas class="sky" id="sky" hidden></canvas>
      <div class="sky-label" id="sky-label" hidden></div>
    </div>
    <div class="legend" id="legend">
      <span><i class="lg-direct"></i>direct successor</span>
      <span><i class="lg-side"></i>side successor</span>
      <span><i class="lg-link"></i>link of the pointer</span>
      <span><b class="lg-fold">+3</b>cards filed behind</span>
    </div>
  </main>

  <aside class="reader" id="reader" aria-live="polite"></aside>
</div>

<div class="finder" id="finder" hidden></div>
<div class="overlay" id="overlay" hidden></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>
</body>
</html>
