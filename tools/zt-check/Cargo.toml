[package]
name = "zt-check"
version = "0.8.0"
edition = "2024"
description = "The book digest's Card quality check (Card language rules R2–R17, Card layer rules I, E, L), as one fast binary for every agent"
publish = false

# A crate of its own: building it never builds zt.
[workspace]

[features]
# The pure core (core, text, policy) is always available. The command-line input
# adapter, the archive audit, the `zt mcp` client, and the binary need `cli`;
# only that feature brings the child-process containment bindings.
default = ["cli"]
cli = ["dep:windows-sys", "dep:libc"]

[[bin]]
name = "zt-check"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0"
regex = "1.12"
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
codegen-units = 16
