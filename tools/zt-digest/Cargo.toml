[package]
name = "zt-digest"
version = "0.27.0"
edition = "2024"
description = "The book digest's tools as one fast binary: the zt helper (call) and the compilers that the digest workflows run"
publish = false

# A crate of its own: building it never builds zt. It takes zt-check as a library,
# so a step runs the Card check in its own process, on its own `zt mcp`.
[workspace]

[[bin]]
name = "zt-digest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
regex = "1.12"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.4"
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.27"
zt-check = { path = "../zt-check" }

[profile.release]
opt-level = 3
codegen-units = 16

