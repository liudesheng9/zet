[package]
name = "zt"
version = "0.34.0"
edition = "2024"
default-run = "zt"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.28"
getrandom = "0.4"
hmac = "0.12"
nom-bibtex = "0.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false }
# The checker's process-free rule core (core, text, policy). No `cli` feature, so
# the service links no archive client, no gate process, and no platform binding.
zt-check = { path = "tools/zt-check", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2.0"
portable-pty = "0.9"
predicates = "3.1"
serde_yaml_ng = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
