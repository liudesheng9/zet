[package]
name = "zt"
version = "0.1.11"
edition = "2024"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.28"
getrandom = "0.4"
nom-bibtex = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"

[dev-dependencies]
assert_cmd = "2.0"
portable-pty = "0.9"
predicates = "3.1"
serde_yaml_ng = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
