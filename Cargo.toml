[package]
name = "zt"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
getrandom = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"

[dev-dependencies]
assert_cmd = "2.0"
portable-pty = "0.9"
predicates = "3.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
